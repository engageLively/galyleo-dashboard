name: Deploy to GitHub Pages

on:
  push:
    branches: [main, feature/static-gcs-deploy]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: app

      # --- Viewer build (base: /galyleo-dashboard/) ---
      - name: Build viewer
        run: npm run build
        working-directory: app
        env:
          VITE_BASE_URL: /galyleo-dashboard/

      - name: Save viewer build
        run: cp -r app/dist app/dist-viewer

      # --- Editor build (base: /galyleo-dashboard/editor/, defaults to edit mode) ---
      - name: Build editor
        run: npm run build
        working-directory: app
        env:
          VITE_BASE_URL: /galyleo-dashboard/editor/
          VITE_DEFAULT_MODE: edit

      # --- Combine: editor lives at /galyleo-dashboard/editor/ ---
      - name: Assemble combined dist
        run: |
          mkdir -p app/dist-viewer/editor
          cp -r app/dist/* app/dist-viewer/editor/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/dist-viewer
